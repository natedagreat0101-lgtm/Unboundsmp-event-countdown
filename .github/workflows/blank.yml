
name: Build Halloween Countdown Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          elif [ -f ./mvnw ]; then
            chmod +x ./mvnw
            ./mvnw --batch-mode package
          else
            echo "No Gradle or Maven build wrapper found."
            exit 1
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: halloween-countdown-mod
          path: |
            build/libs/*.jar
            target/*.jar
          if-no-files-found: error


